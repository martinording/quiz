<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quiz</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1c2230;
      --muted: #5a6478;
      --border: #e2e6ef;
      --accent: #4f46e5;
      --accent-soft: #eef0fe;
      --correct: #16a34a;
      --correct-soft: #e7f6ed;
      --wrong: #dc2626;
      --wrong-soft: #fdeaea;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(20, 26, 45, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141c;
        --card: #1a2029;
        --text: #eef1f6;
        --muted: #9aa4b8;
        --border: #2a323f;
        --accent: #7c74ff;
        --accent-soft: #232544;
        --correct: #38d178;
        --correct-soft: #17301f;
        --wrong: #f4707a;
        --wrong-soft: #331a1d;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
      overflow-x: hidden;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 22px 30px;
      /* clip horizontal slide overflow only, so a sticky child can still
         pin to the viewport vertically */
      overflow-x: clip;
    }
    h1 { margin: 0 0 4px; font-size: 1.35rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }

    .progress-track {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* Per-question countdown bar — retracts from full width to nothing.
       Its width is driven from JS (a linear width transition over the limit). */
    .timer-track {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #22c55e);
    }

    /* Stage holds the animating card */
    .stage { position: relative; }

    .qcard { will-change: transform, opacity; }
    .qcard.enter { animation: slideIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .qcard.exit  { animation: slideOut 0.5s cubic-bezier(0.55, 0, 0.68, 0.2) both; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(64px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(-64px); }
    }

    .qcount { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
    .question { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; min-height: 2.4em; }

    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 16px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 1.05rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.08s;
      touch-action: manipulation;
    }
    .option:active:not(:disabled) { transform: scale(0.98); border-color: var(--accent); background: var(--accent-soft); }
    @media (hover: hover) {
      .option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
    }
    .option:disabled { cursor: default; }
    .option .marker {
      flex: 0 0 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.15s;
    }
    /* Neutral acknowledgement only — correctness is NOT revealed here. */
    .option.selected { border-color: var(--accent); background: var(--accent-soft); }
    .option.selected .marker { border-color: var(--accent); color: #fff; background: var(--accent); }
    .option.picked { animation: pop 0.28s ease; }
    .option.dim { opacity: 0.5; }
    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* Results screen */
    .results { text-align: center; padding: 12px 0 4px; }
    /* Sticky score header — stays at the top while scrolling the answers.
       Full-bleed across the card (negative margins cancel the card padding). */
    .result-head {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--card);
      margin: 0 -22px;
      padding: 8px 22px 12px;
      box-shadow: 0 10px 12px -10px rgba(20, 26, 45, 0.28);
    }
    .celebrate {
      font-size: 4.2rem;
      margin: 6px 0 4px;
      animation: burst 0.8s cubic-bezier(0.18, 1.5, 0.4, 1) both;
    }
    @keyframes burst {
      0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
      55% { transform: scale(1.35) rotate(10deg); opacity: 1; }
      75% { transform: scale(0.92) rotate(-4deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* Confetti celebration — a fixed overlay of falling pieces spawned from JS. */
    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }
    .confetti-piece {
      position: absolute;
      top: -12vh;
      width: 9px;
      height: 15px;
      border-radius: 2px;
      opacity: 0.95;
      animation-name: confetti-fall;
      animation-timing-function: cubic-bezier(0.35, 0.1, 0.7, 1);
      animation-fill-mode: forwards;
      animation-iteration-count: 1;
    }
    @keyframes confetti-fall {
      0%   { transform: translate(0, -12vh) rotate(0); opacity: 1; }
      100% { transform: translate(var(--x, 0), 115vh) rotate(var(--r, 540deg)); opacity: 0.9; }
    }
    .results .big {
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0 2px;
      animation: riseIn 0.5s ease 0.15s both;
    }
    .results .pct { color: var(--muted); font-size: 1.05rem; margin: 0 0 6px; animation: riseIn 0.5s ease 0.25s both; }
    .results .msg { color: var(--text); font-size: 1.05rem; margin: 0 0 22px; animation: riseIn 0.5s ease 0.35s both; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* End-of-quiz review: questions + correct answers, revealed one by one */
    .review { margin-top: 26px; text-align: left; }
    .review h2 {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .review-item {
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 11px;
      margin-bottom: 10px;
      background: var(--card);
      animation: riseIn 0.4s ease both;
    }
    .review-item.correct { border-left-color: var(--correct); background: var(--correct-soft); }
    .review-item.incorrect { border-left-color: var(--wrong); background: var(--wrong-soft); }
    .review-item .rq { font-weight: 600; margin-bottom: 6px; }
    .review-item .ra {
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-size: 0.98rem;
      margin-top: 3px;
    }
    .review-item .ra .tick { flex: 0 0 auto; font-weight: 700; }
    .review-item .ra.right { color: var(--correct); }
    .review-item .ra.wrong { color: var(--wrong); }
    .review-item .rexp {
      margin-top: 7px;
      font-size: 0.72rem;
      line-height: 1.35;
      color: var(--muted);
    }

    /* Start screen */
    .start { text-align: center; padding: 24px 0 10px; }
    .start-lead {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 6px 0 8px;
      animation: riseIn 0.5s ease 0.05s both;
    }
    .start-meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0 0 24px;
      animation: riseIn 0.5s ease 0.15s both;
    }

    button.primary {
      padding: 13px 26px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.08s;
      animation: riseIn 0.5s ease 0.5s both;
      touch-action: manipulation;
    }
    button.primary:active { transform: scale(0.97); }
    button.primary:hover { opacity: 0.9; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="timer-track" id="timer-track" hidden><div class="timer-bar" id="timer-bar"></div></div>
    <h1 id="title">Quiz</h1>
    <div class="sub" id="subtitle">Multiple choice-quiz</div>
    <div class="progress-track" id="progress-track" hidden><div class="progress-bar" id="progress"></div></div>
    <div class="stage" id="stage"></div>
  </main>

  <script src="questions.js"></script>
  <script>
    (function () {
      var data = window.QUIZ || { title: "Quiz", questions: [] };
      var questions = data.questions || [];
      var current = 0;
      var score = 0;
      var picks = [];       // the option index each question was answered with
      var answered = false; // whether the current question has been answered
      var advancing = false;// guards the single, time-driven advance
      var questionTimer = null; // pending start-delay or countdown timeout
      var currentCard = null;   // the question card currently on screen

      // Timings (ms)
      var EXIT = 500;        // slide-out duration (matches CSS)
      var ENTER = 600;       // slide-in duration (matches CSS); timer waits for it
      var TIME_LIMIT = 14000; // per-question countdown — everyone advances together
      var CELEBRATE = 900;   // end-screen burst before the score appears
      var REVIEW_STEP = 1000; // gap between each revealed review item

      var titleEl = document.getElementById("title");
      var subtitleEl = document.getElementById("subtitle");
      var stage = document.getElementById("stage");
      var progress = document.getElementById("progress");
      var progressTrack = document.getElementById("progress-track");
      var timerTrack = document.getElementById("timer-track");
      var timerBar = document.getElementById("timer-bar");

      titleEl.textContent = data.title || "Quiz";
      subtitleEl.textContent = data.subtitle || (questions.length + " spørgsmål");

      function setProgress(n) {
        progress.style.width = (questions.length ? (n / questions.length) * 100 : 0) + "%";
      }

      function renderQuestion() {
        answered = false;
        advancing = false;
        var q = questions[current];
        setProgress(current);

        var card = document.createElement("div");
        card.className = "qcard enter";

        var count = document.createElement("div");
        count.className = "qcount";
        count.textContent = "Spørgsmål " + (current + 1) + " af " + questions.length;
        card.appendChild(count);

        var qEl = document.createElement("div");
        qEl.className = "question";
        qEl.textContent = q.question;
        card.appendChild(qEl);

        var opts = document.createElement("div");
        opts.className = "options";
        var letters = "ABCDEFGHIJ";
        q.options.forEach(function (text, i) {
          var btn = document.createElement("button");
          btn.className = "option";
          btn.type = "button";

          var marker = document.createElement("span");
          marker.className = "marker";
          marker.textContent = letters[i] || (i + 1);
          btn.appendChild(marker);

          var label = document.createElement("span");
          label.textContent = text;
          btn.appendChild(label);

          btn.addEventListener("click", function () { choose(i, q, card, opts); });
          opts.appendChild(btn);
        });
        card.appendChild(opts);

        stage.innerHTML = "";
        stage.appendChild(card);
        currentCard = card;

        // Hold the timer bar full and visible during the entry animation, then
        // start the countdown once the animation has finished.
        timerTrack.hidden = false;
        timerBar.style.transition = "none";
        timerBar.style.width = "100%";
        questionTimer = setTimeout(startTimer, ENTER);
      }

      function startTimer() {
        // Animate the bar from full to empty over the time limit.
        timerBar.style.transition = "none";
        timerBar.style.width = "100%";
        void timerBar.offsetWidth; // force reflow so the next change animates
        timerBar.style.transition = "width " + TIME_LIMIT + "ms linear";
        timerBar.style.width = "0%";
        questionTimer = setTimeout(handleTimeout, TIME_LIMIT);
      }

      function stopTimer() {
        if (questionTimer) { clearTimeout(questionTimer); questionTimer = null; }
        // Freeze the bar where it is so it stops shrinking during the reveal.
        var w = getComputedStyle(timerBar).width;
        timerBar.style.transition = "none";
        timerBar.style.width = w;
      }

      function goNext() {
        if (advancing) return;
        advancing = true;
        currentCard.classList.remove("enter");
        currentCard.classList.add("exit");
        setTimeout(function () {
          current++;
          if (current < questions.length) renderQuestion();
          else renderResults();
        }, EXIT);
      }

      function handleTimeout() {
        questionTimer = null;
        // Time is up — advance whether or not the player answered. This is the
        // only path that moves the quiz on, so everyone who started the
        // question together advances together.
        goNext();
      }

      function choose(i, q, card, opts) {
        if (answered) return;
        answered = true;

        // Record the choice, but stay on the question until the timer runs out.
        // Correctness is not revealed here.
        var buttons = opts.querySelectorAll(".option");
        buttons.forEach(function (b, idx) {
          b.disabled = true;
          if (idx === i) b.classList.add("selected", "picked");
          else b.classList.add("dim");
        });
        picks[current] = i;
        if (i === q.answer) score++;
        // No advance here — handleTimeout() moves on when the countdown ends.
      }

      function renderResults() {
        stopTimer();
        timerTrack.hidden = true;
        setProgress(questions.length);
        var pct = questions.length ? Math.round((score / questions.length) * 100) : 0;
        var emoji = pct === 100 ? "🏆" : pct >= 70 ? "🎉" : pct >= 40 ? "👍" : "💪";
        var msg =
          pct === 100 ? "Perfekt score!" :
          pct >= 70 ? "Flot klaret!" :
          pct >= 40 ? "Ikke dårligt!" :
          "Prøv igen!";

        stage.innerHTML = "";
        var r = document.createElement("div");
        r.className = "results";

        var burst = document.createElement("div");
        burst.className = "celebrate";
        burst.textContent = emoji;
        r.appendChild(burst);

        // Confetti when results appear, and a second burst as the score lands.
        spawnConfetti();
        setTimeout(spawnConfetti, CELEBRATE);

        // Score + rest appear after the celebration animation.
        setTimeout(function () {
          var big = document.createElement("div");
          big.className = "big";
          big.textContent = score + " / " + questions.length;

          var pctEl = document.createElement("p");
          pctEl.className = "pct";
          pctEl.textContent = pct + "%";

          var msgEl = document.createElement("p");
          msgEl.className = "msg";
          msgEl.textContent = msg;

          // Score + percentage sit in a sticky header so the total stays
          // visible at the top while scrolling through the answers.
          var head = document.createElement("div");
          head.className = "result-head";
          head.appendChild(big);
          head.appendChild(pctEl);
          r.appendChild(head);
          r.appendChild(msgEl);

          // Count the score up for a little flair.
          animateCount(big, score, questions.length);

          // Then reveal the correct answers one by one.
          revealAnswers(r);
        }, CELEBRATE);

        stage.appendChild(r);
      }

      function revealAnswers(container) {
        var review = document.createElement("div");
        review.className = "review";
        var heading = document.createElement("h2");
        heading.textContent = "Rigtige svar";
        review.appendChild(heading);
        container.appendChild(review);

        var letters = "ABCDEFGHIJ";
        questions.forEach(function (q, idx) {
          setTimeout(function () {
            var picked = picks[idx];
            var isCorrect = picked === q.answer;

            var item = document.createElement("div");
            item.className = "review-item " + (isCorrect ? "correct" : "incorrect");

            var rq = document.createElement("div");
            rq.className = "rq";
            rq.textContent = (idx + 1) + ". " + q.question;
            item.appendChild(rq);

            // If they got it wrong, show their answer in red first.
            if (!isCorrect) {
              item.appendChild(answerLine("wrong", "✗",
                (picked == null
                  ? "Intet svar"
                  : (letters[picked] || (picked + 1)) + ". " + q.options[picked])));
            }

            // Always show the correct answer in green.
            item.appendChild(answerLine("right", "✓",
              (letters[q.answer] || (q.answer + 1)) + ". " + q.options[q.answer]));

            // Optional explanation in very small text.
            if (q.explanation) {
              var exp = document.createElement("div");
              exp.className = "rexp";
              exp.textContent = q.explanation;
              item.appendChild(exp);
            }

            review.appendChild(item);
          }, REVIEW_STEP * (idx + 1));
        });

        // "Play again" appears after the last answer has been revealed.
        setTimeout(function () {
          var again = document.createElement("button");
          again.className = "primary";
          again.textContent = "Spil igen";
          again.addEventListener("click", function () {
            current = 0; score = 0; picks = []; renderQuestion();
          });
          container.appendChild(again);
        }, REVIEW_STEP * (questions.length + 1));
      }

      function answerLine(kind, symbol, text) {
        var ra = document.createElement("div");
        ra.className = "ra " + kind;
        var tick = document.createElement("span");
        tick.className = "tick";
        tick.textContent = symbol;
        var atext = document.createElement("span");
        atext.textContent = text;
        ra.appendChild(tick);
        ra.appendChild(atext);
        return ra;
      }

      function spawnConfetti() {
        var colors = ["#4f46e5", "#22c55e", "#f59e0b", "#ef4444", "#0ea5e9", "#db2777", "#a855f7"];
        var layer = document.createElement("div");
        layer.className = "confetti-layer";
        for (var i = 0; i < 80; i++) {
          var p = document.createElement("span");
          p.className = "confetti-piece";
          p.style.left = Math.random() * 100 + "%";
          p.style.background = colors[i % colors.length];
          p.style.setProperty("--x", (Math.random() * 180 - 90) + "px");
          p.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
          p.style.animationDelay = (Math.random() * 0.5) + "s";
          p.style.animationDuration = (2.6 + Math.random() * 2) + "s";
          if (Math.random() < 0.4) { p.style.width = "7px"; p.style.height = "7px"; p.style.borderRadius = "50%"; }
          layer.appendChild(p);
        }
        document.body.appendChild(layer);
        setTimeout(function () { layer.remove(); }, 6500);
      }

      function animateCount(el, finalScore, total) {
        if (finalScore <= 0) return;
        var n = 0;
        var step = Math.max(220 / finalScore, 60);
        var timer = setInterval(function () {
          n++;
          el.textContent = n + " / " + total;
          if (n >= finalScore) clearInterval(timer);
        }, step);
      }

      function renderStart() {
        progressTrack.hidden = true;
        timerTrack.hidden = true;
        stage.innerHTML = "";

        var s = document.createElement("div");
        s.className = "start";

        var meta = document.createElement("p");
        meta.className = "start-meta";
        meta.textContent = questions.length + " spørgsmål";

        var btn = document.createElement("button");
        btn.className = "primary";
        btn.textContent = "Start quiz";
        btn.addEventListener("click", startQuiz);

        s.appendChild(meta);
        s.appendChild(btn);
        stage.appendChild(s);
      }

      function startQuiz() {
        current = 0;
        score = 0;
        picks = [];
        progressTrack.hidden = false;
        renderQuestion();
      }

      if (questions.length) renderStart();
      else stage.textContent = "Ingen spørgsmål fundet. Rediger questions.js for at tilføje nogle.";
    })();
  </script>
</body>
</html>
